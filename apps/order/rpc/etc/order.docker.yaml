Name: order-rpc
ListenOn: 0.0.0.0:8085
Timeout: 8000
BaseConfigPath: configs/local/dev.yaml

Etcd:
  Hosts:
    - etcd:2379
  Key: order.rpc

ProductRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: product.rpc

SeckillCreateMaxInFlight: 448
SeckillCreateAcquireTimeoutMs: 240
SeckillOrderEventEnabled: true
SeckillOrderEventAsyncWorkers: 16
SeckillOrderEventAsyncQueueSize: 16384
SeckillOrderEventPublishTimeoutMs: 200
