worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # 用户网关（公开接口）
    upstream user_gateway {
        server host.docker.internal:8082;
        keepalive 64;
    }

    # 管理网关（管理端接口）
    upstream admin_gateway {
        server host.docker.internal:8083;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Nginx 自身健康检查
        location = /nginx-healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # 用户网关健康检查透传
        location = /healthz {
            proxy_pass http://user_gateway/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 管理网关健康检查透传
        location = /admin-healthz {
            proxy_pass http://admin_gateway/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 管理端 API
        location /api/v1/admin/ {
            proxy_pass http://admin_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 用户端 API
        location /api/v1/ {
            proxy_pass http://user_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }
    }
}

