Name: seckill-rpc
ListenOn: 0.0.0.0:8086
Mode: pro
DevServer:
  Enabled: true
  Port: 6060
Timeout: 8000
BaseConfigPath: configs/local/dev.yaml
SnowflakeNode: 6

Telemetry:
  Name: seckill.rpc
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Etcd:
  Hosts:
    - etcd:2379
  Key: seckill.rpc

ProductRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: product.rpc

OrderRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: order.rpc
  Timeout: 4000

ActivityItemCacheTTLMs: 1500
ReservePurchaseTimeoutMs: 5000
ReserveDBUserLimitCheck: false
OrderCreateRPCTimeoutMs: 4200
OrderCreateMaxInFlight: 448
OrderCreateAcquireTimeoutMs: 240
OrderLinkWriteOnPurchase: false
OrderLinkSyncFallback: false
OrderLinkAsyncWorkers: 12
OrderLinkAsyncQueueSize: 8192
OrderLinkWriteTimeoutMs: 800
TrafficAsyncWorkers: 16
TrafficAsyncQueueSize: 32768
TrafficWriteTimeoutMs: 300
TrafficPublishTimeoutMs: 300
PerfLogIntervalSec: 30
