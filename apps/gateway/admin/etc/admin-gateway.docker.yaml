Name: admin-gateway
ListenOn: 0.0.0.0:8083
BaseConfigPath: configs/local/dev.yaml

UserRPC:
  Target: user-rpc:8081

AdminRPC:
  Target: admin-rpc:8087

ProductRPC:
  Target: product-rpc:8084

OrderRPC:
  Target: order-rpc:8085

# 通过 gRPC LB 访问秒杀服务，支持 seckill-rpc 多实例扩容。
SeckillRPC:
  Target: grpc-lb:18086
  Timeout: 8000

