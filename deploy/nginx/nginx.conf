worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # 用户网关（公开接口）
    upstream user_gateway {
        server host.docker.internal:8082;
        keepalive 64;
    }

    # 管理网关（管理端接口）
    upstream admin_gateway {
        server host.docker.internal:8083;
        keepalive 64;
    }

    # Ops Control（运维控制台）
    upstream ops_control {
        server host.docker.internal:18080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Nginx 自身健康检查
        location = /nginx-healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # 用户网关健康检查透传
        location = /healthz {
            proxy_pass http://user_gateway/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 管理网关健康检查透传
        location = /admin-healthz {
            proxy_pass http://admin_gateway/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 管理端 API
        location /api/v1/admin/ {
            proxy_pass http://admin_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # 用户端 API
        location /api/v1/ {
            proxy_pass http://user_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Ops 控制台（Web + API + SSE 日志流）
        # 说明：ops-control 本身以 "/" 提供页面，为了与业务 API 隔离，这里挂载到 /ops/ 前缀。
        # 需要关闭 buffering 才能让 SSE “实时流式”效果正常。
        location = /ops {
            return 301 /ops/;
        }
        location /ops/ {
            proxy_pass http://ops_control/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        location / {
            return 404;
        }
    }
}

