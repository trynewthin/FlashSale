# 秒杀 gRPC 负载均衡（L4 TCP）
#
# 用途：
# - 演示“只扩容单个服务”（seckill-rpc 多实例）时，网关仍只需要连接一个固定地址。
# - 不引入 etcd/consul 等服务发现复杂度，使用 Docker DNS 多 A 记录 + Nginx resolve 实现动态后端列表。

worker_processes 1;

events {
  worker_connections 1024;
}

stream {
  # Docker 内置 DNS
  resolver 127.0.0.11 ipv6=off valid=5s;

  upstream seckill_rpc_pool {
    # 使用 resolve 运行时解析时，upstream 必须落在共享内存（zone）中，否则 nginx 会直接启动失败。
    # 这里 64k 足够容纳少量后端（秒杀服务一般不会无限扩容，演示场景通常 2~10 个实例）。
    zone seckill_rpc_pool 64k;

    # 使用 service 名称解析到多实例（docker compose --scale seckill-rpc=N）
    server seckill-rpc:8086 resolve;
  }

  server {
    listen 18086;
    proxy_pass seckill_rpc_pool;

    proxy_connect_timeout 1s;
    proxy_timeout 30s;
  }
}
