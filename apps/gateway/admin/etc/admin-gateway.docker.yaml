Name: admin-gateway
ListenOn: 0.0.0.0:8083
Mode: pro
DevServer:
  Enabled: true
  Port: 6060
BaseConfigPath: configs/local/dev.yaml

Telemetry:
  Name: admin-gateway
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

UserRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: user.rpc

AdminRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: admin.rpc

ProductRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: product.rpc

OrderRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: order.rpc

SeckillRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: seckill.rpc
  Timeout: 8000
