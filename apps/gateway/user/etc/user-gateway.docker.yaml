Name: user-gateway
ListenOn: 0.0.0.0:8082
Mode: pro
BaseConfigPath: configs/local/dev.yaml

Telemetry:
  Name: user-gateway
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

UserRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: user.rpc

ProductRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: product.rpc

OrderRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: order.rpc

SeckillRPC:
  Etcd:
    Hosts:
      - etcd:2379
    Key: seckill.rpc
  Timeout: 8000

SeckillPurchaseRPCTimeoutMs: 8000
SeckillTrackEventRPCTimeoutMs: 4000
