# ─── 基础设施：MySQL / Redis / Kafka / etcd ───
services:
  mysql:
    image: mysql:8.4
    container_name: flashsale-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FLASH_MYSQL_ROOT_PASSWORD:-flashsale_root_dev}
      TZ: Asia/Shanghai
    ports:
      - "${FLASH_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 12

  mysql-init-user:
    image: mysql:8.4
    container_name: flashsale-app-mysql-init-user
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${FLASH_MYSQL_ROOT_PASSWORD:-flashsale_root_dev}
      MYSQL_APP_USER: ${FLASH_MYSQL_APP_USER:-flash}
      MYSQL_APP_PASSWORD: ${FLASH_MYSQL_APP_PASSWORD:-flashsale_app_dev}
    command:
      - /bin/bash
      - -ec
      - |
        mysql -hmysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "
        CREATE USER IF NOT EXISTS '$$MYSQL_APP_USER'@'%' IDENTIFIED BY '$$MYSQL_APP_PASSWORD';
        GRANT ALL PRIVILEGES ON flash_user.* TO '$$MYSQL_APP_USER'@'%';
        GRANT ALL PRIVILEGES ON flash_admin.* TO '$$MYSQL_APP_USER'@'%';
        GRANT ALL PRIVILEGES ON flash_product.* TO '$$MYSQL_APP_USER'@'%';
        GRANT ALL PRIVILEGES ON flash_order.* TO '$$MYSQL_APP_USER'@'%';
        GRANT ALL PRIVILEGES ON flash_seckill.* TO '$$MYSQL_APP_USER'@'%';
        FLUSH PRIVILEGES;
        "

  redis:
    image: redis:7.2-alpine
    container_name: flashsale-app-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${FLASH_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: flashsale-app-kafka
    restart: unless-stopped
    ports:
      - "${FLASH_KAFKA_PORT:-39092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${FLASH_KAFKA_PORT:-39092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: flashsale-app-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order.create --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order.create.dlq --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic stock.compensate --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seckill.purchase.create --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seckill.purchase.create.dlq --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seckill.traffic.raw --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seckill.traffic.dlq --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic seckill.order.state --partitions 3 --replication-factor 1

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: flashsale-app-etcd
    restart: unless-stopped
    command:
      - etcd
      - --name=flashsale-etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
    ports:
      - "${FLASH_ETCD_PORT:-12379}:2379"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  redis_data:
  etcd_data:
