name: flashsale-app

# 拆分为 4 个子文件，按职责分组维护：
#   app/infra.yml          — 基础设施（MySQL, Redis, Kafka, etcd）
#   app/backend.yml        — 后端服务（migrate, RPC 微服务, API 网关）
#   app/proxy.yml          — 代理与运维（Nginx, CDN, media-store, ops-control）
#   app/observability.yml  — 可观测性（Jaeger, Prometheus, Grafana）

include:
  - app/infra.yml
  - app/backend.yml
  - app/proxy.yml
  - app/observability.yml
