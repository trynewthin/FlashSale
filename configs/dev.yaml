service: flashsale-base

log:
  level: info
  format: json

mysql:
  host: 127.0.0.1
  port: 13306
  user: flash
  password: ""
  database: flash_user
  params: parseTime=true&loc=Local&charset=utf8mb4
  maxOpenConns: 50
  maxIdleConns: 10
  connMaxLifetime: 30m
  databases:
    - flash_user
    - flash_admin
    - flash_product
    - flash_order
    - flash_seckill

redis:
  addr: 127.0.0.1:16379
  password: ""
  db: 0
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s

kafka:
  brokers:
    - 127.0.0.1:39092
  clientID: flashsale-local
  groupID: flashsale-smoke
  topics:
    orderCreate: order.create
    orderCreateDLQ: order.create.dlq
    stockCompensate: stock.compensate
    seckillPurchaseCreate: seckill.purchase.create
    seckillPurchaseCreateDLQ: seckill.purchase.create.dlq
    seckillTrafficRaw: seckill.traffic.raw
    seckillTrafficDLQ: seckill.traffic.dlq
    seckillOrderState: seckill.order.state

jwt:
  user:
    secret: user-secret-change-me
    issuer: flashsale-user
    audience: flashsale-user-client
    ttl: 24h
  admin:
    secret: admin-secret-change-me
    issuer: flashsale-admin
    audience: flashsale-admin-client
    ttl: 12h

otel:
  endpoint: 127.0.0.1:4317
  insecure: true
  serviceName: flashsale-base

prometheus:
  addr: :9100
  path: /metrics
  namespace: flashsale
