# ─── 可观测性（可选 profile）───
# 启动方式：docker compose -f docker-compose.app.yml --profile observability up -d
services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: flashsale-app-jaeger
    profiles: [ "observability" ]
    ports:
      - "${FLASH_JAEGER_UI_PORT:-16686}:16686"
      - "${FLASH_OTEL_PORT:-4317}:4317"
    mem_limit: ${FLASH_JAEGER_MEM_LIMIT:-0}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:16686" ]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: flashsale-app-prometheus
    profiles: [ "observability" ]
    ports:
      - "${FLASH_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    mem_limit: ${FLASH_PROMETHEUS_MEM_LIMIT:-0}

  grafana:
    image: grafana/grafana:10.4.5
    container_name: flashsale-app-grafana
    profiles: [ "observability" ]
    ports:
      - "${FLASH_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${FLASH_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${FLASH_GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    mem_limit: ${FLASH_GRAFANA_MEM_LIMIT:-0}
