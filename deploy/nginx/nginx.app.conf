# FlashSale App Nginx（后端全容器化版本）
#
# 与 deploy/nginx/nginx.conf 的区别：
# - nginx.conf：依赖容器化 + 后端进程在宿主机（通过 host.docker.internal 反代）
# - nginx.app.conf：后端服务也在 Docker 网络内（直接反代到 service 名称）

worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  # JSON 结构化 access log：便于 Promtail/Loki/Grafana 等工具直接采集分析。
  log_format json_log escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"args":"$args",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status",'
      '"http_user_agent":"$http_user_agent",'
      '"http_referer":"$http_referer",'
      '"request_id":"$request_id"'
    '}';

  access_log /var/log/nginx/access.log json_log;


  # Docker 内置 DNS：用于在容器重建/扩容后，自动重新解析 service 名称（避免 Nginx 缓存旧 IP 导致 502）。
  resolver 127.0.0.11 ipv6=off valid=5s;

  upstream user_gateway {
    # 使用 resolve 运行时解析时，upstream 必须落在共享内存（zone）中，否则 nginx 会直接启动失败。
    zone user_gateway 64k;
    server user-gateway:8082 resolve;
    keepalive 64;
  }

  upstream admin_gateway {
    zone admin_gateway 64k;
    server admin-gateway:8083 resolve;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;

    location = /nginx-healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # 用户侧健康检查（透传到 user-gateway）
    location = /healthz {
      access_log off;
      proxy_pass http://user_gateway/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # 管理侧健康检查（透传到 admin-gateway）
    location = /admin-healthz {
      access_log off;
      proxy_pass http://admin_gateway/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # 管理端 API
    location /api/v1/admin/ {
      proxy_pass http://admin_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # 用户端 API
    location /api/v1/ {
      proxy_pass http://user_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    location / {
      return 404;
    }
  }
}
